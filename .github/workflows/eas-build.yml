name: EAS Build (native binaries)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]
      submit:
        description: Submit to the app stores after build (production only)
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger EAS build
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Submit to stores
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: |
          eas submit \
            --platform ${{ inputs.platform }} \
            --profile production \
            --non-interactive \
            --latest
